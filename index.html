<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Coffee Shop Strategy · Business Dashboard</title>
<meta name="description" content="An interactive Python (Streamlit) dashboard of 15 Coffee Shop Inc. simulation runs, running entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.css">
<style>
 html,body{margin:0;height:100%;background:#fbf5ea}
 #root{height:100%}
 .boot{height:100%;display:grid;place-items:center;font-family:Georgia,serif;color:#3d1a10;text-align:center}
 .boot small{display:block;margin-top:10px;font:600 12px/1.5 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#d39543}
</style>
<script data-goatcounter="https://shabcoffee.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="root"><div class="boot"><div>☕ Brewing the dashboard…<small>Python is starting in your browser · first visit takes about 20 seconds</small></div></div></div>
<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.1/build/stlite.js";
const v = "?v=1";
mount({
  requirements: ["plotly"],
  entrypoint: "streamlit_app.py",
  files: {
    "streamlit_app.py": { url: "./streamlit_app.py" + v },
    "data.json": { url: "./data.json" + v },
  },
  streamlitConfig: {
    "theme.base": "light",
    "theme.primaryColor": "#7a3320",
    "theme.backgroundColor": "#fbf5ea",
    "theme.secondaryBackgroundColor": "#f3e6cf",
    "theme.textColor": "#2e1810",
    "client.toolbarMode": "viewer",
  },
}, document.getElementById("root"));
</script>
</body>
</html>
